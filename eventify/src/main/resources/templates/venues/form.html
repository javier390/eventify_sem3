<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Lugar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="mb-4">Registrar Nuevo Lugar</h1>

<form th:action="@{/admin/venues}" th:object="${venue}" method="post">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombre}" />
        <span class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    </div>

    <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" th:field="*{direccion}" />
        <span class="text-danger" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></span>
    </div>

    <div class="mb-3">
        <label class="form-label">Capacidad</label>
        <input type="number" class="form-control" th:field="*{capacidad}" />
        <span class="text-danger" th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}"></span>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a th:href="@{/admin/venues}" class="btn btn-link">Cancelar</a>

</form>

</body>
</html>
