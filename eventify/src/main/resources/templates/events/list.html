<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Eventos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="mb-4">Catálogo de Eventos</h1>

<div class="mb-3">
    <a th:href="@{/admin/events/nuevo}" class="btn btn-primary">+ Nuevo Evento</a>
    <a th:href="@{/admin/venues}" class="btn btn-outline-secondary">Ver Lugares</a>
</div>

<!-- Escenario 2: catalogo vacio -->
<div th:if="${#lists.isEmpty(events)}" class="alert alert-info">
    Actualmente no hay eventos programados
</div>

<!-- Escenario 1: listado con datos -->
<table class="table table-striped" th:unless="${#lists.isEmpty(events)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Fecha</th>
        <th>Descripción</th>
        <th>Lugar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="event : ${events}">
        <td th:text="${event.id}">1</td>
        <td th:text="${event.nombre}">Nombre</td>
        <td th:text="${event.fecha}">2026-01-01</td>
        <td th:text="${event.descripcion}">Descripción</td>
        <td th:text="${event.venue != null ? event.venue.nombre : 'Sin asignar'}">Lugar</td>
    </tr>
    </tbody>
</table>

</body>
</html>
