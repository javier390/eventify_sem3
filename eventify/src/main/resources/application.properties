spring.application.name=eventify

# Base de datos H2 persistida en archivo (para que sobreviva reinicios)
spring.datasource.url=jdbc:h2:file:./data/eventifydb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Swagger/OpenAPI: solo documentar rutas /api/**, dejando /admin/** fuera de la documentacion
springdoc.pathsToMatch=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
